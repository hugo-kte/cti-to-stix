[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gleaner"
version = "0.1.0"
description = "Threat-report extraction with NLP: indicators, entities and ATT&CK techniques, exported as validated STIX 2.1 bundles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hugo" }]
keywords = ["threat-intelligence", "cti", "stix", "mitre-attack", "nlp", "ioc-extraction", "ner"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "python-crfsuite>=0.9.10",
    "publicsuffixlist>=1.0",
    "stix2>=3.0.1",
    # 3.3.1 ships without its JSON schemas and cannot validate anything; 3.2.0 bundles them.
    "stix2-validator==3.2.0",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.0"]

[project.scripts]
gleaner = "gleaner.cli:app"

[project.urls]
Repository = "https://github.com/hugo-kte/cti-to-stix"

[tool.hatch.build.targets.wheel]
packages = ["src/gleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
source = ["gleaner"]
