# Public datasets used to build and evaluate Gleaner. Every file is pinned to a commit and
# listed with its SHA-256 in checksums.sha256 (paths relative to data/raw/).
# `gleaner download` fetches them from raw.githubusercontent.com and verifies the checksums.
# The corpora are never committed to this repository.

