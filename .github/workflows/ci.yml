name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test (fixtures only, no dataset download)
        run: pytest --cov --cov-report=term-missing
      - name: CLI smoke test (committed catalog and technique model, STIX validation)
        run: |
          gleaner iocs examples/glass-heron.md
          gleaner extract examples/advisory-no-names.txt --format md
          gleaner extract examples/glass-heron.md --format stix -o bundle.json
          gleaner validate bundle.json
